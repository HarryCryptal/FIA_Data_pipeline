
services:
  fia-pg:
    image: pgvector/pgvector:pg17
    container_name: fia-pg
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fia-baseline/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  postgres_data: